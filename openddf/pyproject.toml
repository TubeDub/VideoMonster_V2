[project]
name = "openddf"
version = "0.1.0"
description = "Open Developer Diagnostic Framework — mutation guard, timeline, diagnostic ZIP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
