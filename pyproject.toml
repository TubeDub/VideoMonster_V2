[project]
name = "tubedub"
version = "2.0.0"
description = "AI video dubbing — speech recognition, translation, TTS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "TubeDub Team" }]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]
ml = ["transformers>=4.40", "torch>=2.0"]
desktop = ["pywebview>=5.0", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["api", "engines", "openddf", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
